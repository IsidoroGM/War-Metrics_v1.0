# PostgreSQL externo: no se permite caer a una base efímera por configuración incompleta.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeño y sin conexiones mínimas permanentes para el plan gratuito.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.channelBinding=require

server.servlet.session.cookie.secure=true

# Render sondea este endpoint continuamente. No despertar Neon con cada sondeo.
# La salud HTTP comprueba el proceso; la conexión real se valida en los flujos de API.
management.health.db.enabled=false
