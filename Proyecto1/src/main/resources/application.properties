spring.application.name=WarMetrics

# Solo se publica el estado de salud; no se exponen datos internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Carpeta nueva: las bases antiguas versionadas no se abren ni modifican.
spring.datasource.url=${DB_URL:jdbc:h2:file:./runtime-data/warmetricsdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.deserialization.accept-float-as-int=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
